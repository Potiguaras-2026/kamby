# Demo no Render free: API + admin + Postgres. Ver docs/infra.md, seção "Demo: Vercel + Render".
services:
  - type: web
    name: kamby-api
    runtime: docker
    plan: free
    # Caminhos relativos à raiz do repositório (spec do Blueprint).
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: KAMBY_DEMO
        value: "1"
      - key: SEED_SENHA
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase: { name: kamby-db, property: connectionString }

databases:
  - name: kamby-db
    plan: free
    databaseName: kamby
    user: kamby
